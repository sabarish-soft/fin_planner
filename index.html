<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wealth plan</title>
<style>
  :root {
    --paper: #10141a;
    --card: #1a212b;
    --ink: #e8eef5;
    --muted: #9aa6b4;
    --line: #2e3846;
    --green: #3dbe86;
    --green-soft: #143328;
    --warn: #e0a06a;
    --warn-soft: #3a2a1c;
    --field: #0e1319;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.45 "Avenir Next", "Segoe UI", sans-serif;
  }
  header, main { width: min(1100px, calc(100% - 32px)); margin: 0 auto; }
  header { padding: 28px 0 8px; }
  h1 { font-family: Palatino, "Palatino Linotype", serif; font-weight: 600; font-size: 32px; margin: 0 0 4px; }
  h2 { font-family: Palatino, "Palatino Linotype", serif; font-size: 22px; margin: 0 0 12px; }
  h3 { font-size: 15px; margin: 14px 0 4px; font-weight: 600; }
  .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  p.lead { color: var(--muted); margin: 0; }
  .bar, .row, .actions, .presets { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar { justify-content: space-between; margin: 18px 0; }
  button, select, .file {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    font: inherit;
  }
  button { cursor: pointer; }
  button.primary { background: var(--green); color: white; border-color: var(--green); }
  button.ghost { background: transparent; }
  button.warn { color: var(--warn); }
  button:disabled { opacity: 0.45; cursor: default; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px 18px;
    margin: 0 0 14px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  input, select { font: inherit; color: var(--ink); padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
  .item { border-top: 1px solid var(--line); padding: 10px 0; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  button.icon { width: 34px; height: 34px; padding: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
  button.icon svg { width: 16px; height: 16px; }
  .editor { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0 0 10px; background: #141b24; }
  .chart { position: relative; }
  .tip { position: absolute; z-index: 2; pointer-events: none; background: #0e1319; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--ink); min-width: 140px; }
  .item strong { display: block; }
  .meta { color: var(--muted); font-size: 13px; }
  .note { background: var(--warn-soft); color: var(--warn); padding: 8px 10px; border-radius: 8px; margin: 8px 0; }
  .ok { background: var(--green-soft); color: var(--green); padding: 10px 12px; border-radius: 8px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
  .stat { background: var(--paper); border-radius: 10px; padding: 10px 12px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  svg { width: 100%; height: auto; }
  .chart-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 800px) { .chart-grid { grid-template-columns: 1fr 1fr; } }
  .check { flex-direction: row; align-items: center; gap: 8px; color: var(--ink); }
  @media print {
    body { background: white; color: #1b2430; }
    .card, .editor, .stat { background: white; color: #1b2430; }
    input, select, button { color: #1b2430; background: white; }
    .noprint { display: none !important; }
    header, main { width: auto; }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<header>
  <h1>Wealth plan</h1>
  <p class="lead">Yearly retirement projection in rupees. It updates as you edit.</p>
</header>
<main id="app"></main>
<script id="engine">
(function () {
  function yearOf(iso) { return Number(String(iso).slice(0, 4)); }
  function isoOf(y, m, d) {
    return String(y) + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }
  function addMonths(iso, n) {
    const y0 = yearOf(iso);
    const m0 = Number(iso.slice(5, 7));
    const d0 = Number(iso.slice(8, 10));
    const idx = y0 * 12 + (m0 - 1) + n;
    const y = Math.floor(idx / 12);
    const m = (idx % 12) + 1;
    const dim = new Date(y, m, 0).getDate();
    return isoOf(y, m, Math.min(d0, dim));
  }
  function addYears(iso, n) { return addMonths(iso, n * 12); }
  function ageOn(dob, date) {
    let age = yearOf(date) - yearOf(dob);
    if (String(date).slice(5) < String(dob).slice(5)) age -= 1;
    return age;
  }
  function birthday(dob, age) { return addYears(dob, Number(age)); }
  function pmt(principal, rate, n) {
    if (n <= 0 || principal <= 0) return 0;
    if (!rate) return principal / n;
    const grown = Math.pow(1 + rate, n);
    return principal * rate * grown / (grown - 1);
  }
  function loanLength(plan, endDate) {
    if (!endDate || endDate <= plan.planStartDate) return 0;
    const n = yearOf(endDate) - yearOf(plan.planStartDate);
    return n < 1 ? 1 : n;
  }
  function profileError(plan) {
    if (!plan.dateOfBirth || !plan.planStartDate) return "Enter date of birth and plan start.";
    const age = ageOn(plan.dateOfBirth, plan.planStartDate);
    if (age < 0 || age > 120) return "Plan start must be on or after the date of birth.";
    if (!(plan.lifeExpectancyAge > age) || plan.lifeExpectancyAge > 120) return "Life expectancy must be after the age at plan start.";
    if (!(plan.retirementAge > age) || plan.retirementAge > plan.lifeExpectancyAge) return "Retirement age must be after the age at plan start and no later than life expectancy.";
    return "";
  }
  function scheduleDates(start, every, unit, from, to, year) {
    const step = Math.max(1, Number(every) || 1);
    const dates = [];
    let d = start;
    let guard = 0;
    while (yearOf(d) < year && guard++ < 20000) d = unit === "year" ? addYears(d, step) : addMonths(d, step);
    while (yearOf(d) === year && guard++ < 20000) {
      if (d >= from && d <= to) dates.push(d);
      d = unit === "year" ? addYears(d, step) : addMonths(d, step);
    }
    return dates;
  }
  function lastIncomeYear(income, plan) {
    if (income.endDate) return yearOf(income.endDate);
    return yearOf(plan.dateOfBirth) + Number(plan.retirementAge) - 1;
  }
  function amountInYear(income, year, plan) {
    if (income.kind === "once") return Number(income.amountToday) || 0;
    const startY = yearOf(income.startDate);
    const k = year - startY;
    if (k <= 0) return Number(income.amountToday) || 0;
    const span = Math.max(lastIncomeYear(income, plan) - startY, 1);
    let amount = Number(income.amountToday) || 0;
    const gs = Number(income.growthStart) || 0;
    const ge = Number(income.growthEnd) || 0;
    for (let i = 1; i <= k; i++) {
      const t = span <= 1 ? 0 : (i - 1) / (span - 1);
      amount *= 1 + gs + (ge - gs) * t;
    }
    return amount;
  }
  function incomeDates(income, plan, year) {
    if (!income.startDate) return [];
    if (income.kind === "once") {
      return yearOf(income.startDate) === year ? [income.startDate] : [];
    }
    const end = income.endDate || "9999-12-31";
    return scheduleDates(income.startDate, income.every, income.unit, income.startDate, end, year).filter(function (d) {
      if (income.endDate) return d <= income.endDate;
      return ageOn(plan.dateOfBirth, d) < Number(plan.retirementAge);
    });
  }
  function goalDates(plan, goal, year) {
    if (goal.kind === "once") {
      if (yearOf(plan.dateOfBirth) + Number(goal.targetAge) !== year) return [];
      return [birthday(plan.dateOfBirth, goal.targetAge)];
    }
    const start = birthday(plan.dateOfBirth, goal.startAge);
    const end = birthday(plan.dateOfBirth, goal.endAge);
    return scheduleDates(start, goal.every, goal.unit, start, end, year);
  }
  function inflationRate(goal, plan) {
    if (goal && goal.inflation != null && goal.inflation !== "") return Number(goal.inflation) || 0;
    return Number(plan.inflation) || 0;
  }
  function inflated(goal, plan, year) {
    const rate = inflationRate(goal, plan);
    const years = year - yearOf(plan.planStartDate);
    let cost = Number(goal.amountToday) || 0;
    for (let i = 0; i < years; i++) cost *= 1 + rate;
    return cost;
  }
  function draw(state, amount, spendLocked) {
    let left = amount;
    const fromSurplus = Math.min(Math.max(0, state.surplus), left);
    state.surplus -= fromSurplus;
    left -= fromSurplus;
    state.assets.forEach(function (asset) {
      if (!asset.liquid || left <= 0) return;
      const take = Math.min(Math.max(0, asset.amount), left);
      asset.amount -= take;
      left -= take;
    });
    if (spendLocked) {
      state.assets.forEach(function (asset) {
        if (asset.liquid || left <= 0) return;
        const take = Math.min(Math.max(0, asset.amount), left);
        asset.amount -= take;
        left -= take;
      });
    }
    return amount - left;
  }
  function service(state, loan) {
    if (loan.left <= 0 || loan.balance <= 0) return { interest: 0, paid: 0 };
    const interest = loan.balance * loan.rate;
    loan.balance += interest;
    const due = loan.left === 1 ? loan.balance : Math.min(loan.payment, loan.balance);
    const paid = draw(state, due);
    loan.balance = Math.max(0, loan.balance - paid);
    loan.left -= 1;
    return { interest: interest, paid: paid, unpaid: due - paid };
  }
  function project(plan) {
    const startYear = yearOf(plan.planStartDate);
    const endYear = yearOf(plan.dateOfBirth) + Number(plan.lifeExpectancyAge);
    const assets = (plan.assets || []).map(function (asset) {
      return {
        amount: Number(asset.amount) || 0,
        growth: Number(asset.growth) || 0,
        rebalanceDate: asset.rebalanceDate || plan.planStartDate,
        liquid: yearOf(asset.rebalanceDate || plan.planStartDate) <= startYear
      };
    });
    const loans = [];
    (plan.liabilities || []).forEach(function (row) {
      const n = loanLength(plan, row.endDate);
      const principal = Number(row.principal) || 0;
      if (!n || principal <= 0) return;
      loans.push({
        balance: principal,
        rate: Number(row.annualRate) || 0,
        payment: pmt(principal, Number(row.annualRate) || 0, n),
        left: n
      });
    });
    const state = { assets: assets, surplus: 0, contingency: 0, loans: loans };
    const rows = [];
    let interestPaid = 0;
    let totalInvested = 0;
    for (let year = startYear; year <= endYear; year++) {
      const avg = state.assets.length
        ? state.assets.reduce(function (sum, asset) { return sum + asset.growth; }, 0) / state.assets.length
        : 0;
      state.assets.forEach(function (asset) { asset.amount *= 1 + asset.growth; });
      state.surplus *= 1 + avg;
      state.contingency *= 1.04;
      state.assets.forEach(function (asset) {
        if (year >= yearOf(asset.rebalanceDate)) asset.liquid = true;
      });
      let income = 0;
      (plan.incomes || []).forEach(function (item) {
        const dates = incomeDates(item, plan, year);
        if (!dates.length) return;
        income += dates.length * amountInYear(item, year, plan);
      });
      state.surplus += income;
      let liabilityPayment = 0;
      let interest = 0;
      let shortfall = 0;
      state.loans.forEach(function (loan) {
        const step = service(state, loan);
        interest += step.interest;
        liabilityPayment += step.paid;
        shortfall += step.unpaid;
      });
      let goalSpending = 0;
      let goalCash = 0;
      const milestones = [];
      let shieldedNeed = 0;
      (plan.goals || []).forEach(function (goal) {
        if (!(goal.safetyShield && goal.kind === "recurring")) return;
        const due = goalDates(plan, goal, year);
        shieldedNeed += due.length * inflated(goal, plan, year);
      });
      let contingencyCover = income < shieldedNeed ? Math.min(state.contingency, shieldedNeed - income) : 0;
      (plan.goals || []).forEach(function (goal, goalIndex) {
        const dates = goalDates(plan, goal, year);
        if (!dates.length) return;
        const each = inflated(goal, plan, year);
        milestones.push({ name: goal.name || "Goal", amount: dates.length * each, once: goal.kind === "once", index: goalIndex });
        dates.forEach(function () {
          let cost = each;
          if (goal.kind === "once" && goal.loan) {
            const downPct = Math.min(100, Math.max(0, Number(goal.loan.downPaymentPercent) || 0)) / 100;
            const down = cost * downPct;
            const borrowed = Math.max(0, cost - down);
            const paidDown = draw(state, down, true);
            goalCash += paidDown;
            shortfall += down - paidDown;
            goalSpending += down;
            const tenor = Math.max(1, Number(goal.loan.tenorYears) || 1);
            const rate = Number(goal.loan.annualRate) || 0;
            if (borrowed > 0) {
              const created = {
                balance: borrowed,
                rate: rate,
                payment: pmt(borrowed, rate, tenor),
                left: tenor
              };
              state.loans.push(created);
              const step = service(state, created);
              interest += step.interest;
              liabilityPayment += step.paid;
              shortfall += step.unpaid;
            }
            return;
          }
          let unpaid = 0;
          if (goal.safetyShield && goal.kind === "recurring" && contingencyCover > 0) {
            const fromPot = Math.min(contingencyCover, cost);
            state.contingency -= fromPot;
            contingencyCover -= fromPot;
            cost -= fromPot;
            goalSpending += fromPot;
          }
          const paid = draw(state, cost, goal.kind === "once");
          goalCash += paid;
          goalSpending += paid;
          unpaid = cost - paid;
          shortfall += unpaid;
          goalSpending += unpaid;
        });
      });
      const debt = state.loans.reduce(function (sum, loan) { return sum + loan.balance; }, 0);
      const savings = Math.max(0, income - liabilityPayment - goalCash);
      let recurringCost = 0;
      (plan.goals || []).forEach(function (goal) {
        if (goal.kind === "once") return;
        recurringCost += goalDates(plan, goal, year).length * inflated(goal, plan, year);
      });
      const target = (Number(plan.contingencyMonths) || 0) * (recurringCost / 12);
      if (state.contingency < target && savings > 0) {
        const moved = draw(state, Math.min(savings, target - state.contingency));
        state.contingency += moved;
        totalInvested += savings - moved;
      } else {
        totalInvested += savings;
      }
      interestPaid += interest;
      const assetSum = state.assets.reduce(function (sum, asset) { return sum + asset.amount; }, 0);
      const netWorth = assetSum + state.surplus + state.contingency - debt;
      rows.push({
        age: year - yearOf(plan.dateOfBirth),
        year: year,
        income: income,
        goalSpending: goalSpending,
        liabilityPayment: liabilityPayment,
        interest: interest,
        contingency: state.contingency,
        shortfall: shortfall,
        netWorth: netWorth,
        assets: assetSum + state.surplus + state.contingency,
        liabilities: debt,
        milestones: milestones
      });
    }
    let peak = rows[0] || { netWorth: 0, age: null };
    rows.forEach(function (row) { if (row.netWorth > peak.netWorth) peak = row; });
    const shortRow = rows.find(function (row) { return row.shortfall > 0.5; });
    return {
      rows: rows,
      funded: !shortRow,
      firstShortfallAge: shortRow ? shortRow.age : null,
      finalNetWorth: rows.length ? rows[rows.length - 1].netWorth : 0,
      peakNetWorth: peak.netWorth,
      peakAge: peak.age,
      interestPaid: interestPaid,
      totalInvested: totalInvested,
      contingencyEnd: rows.length ? rows[rows.length - 1].contingency : 0,
      unfunded: rows.reduce(function (sum, row) { return sum + row.shortfall; }, 0)
    };
  }
  function earliestRetirementAge(plan) {
    const startAge = ageOn(plan.dateOfBirth, plan.planStartDate);
    let found = null;
    for (let age = startAge + 1; age <= Number(plan.lifeExpectancyAge); age++) {
      const trial = JSON.parse(JSON.stringify(plan));
      trial.retirementAge = age;
      if (project(trial).funded) return age;
    }
    return found;
  }
  globalThis.WealthPlan = {
    project: project,
    earliestRetirementAge: earliestRetirementAge,
    profileError: profileError,
    ageOn: ageOn,
    loanLength: loanLength
  };
})();
</script>
<script>
(function () {
  const WP = globalThis.WealthPlan;
  const KEY = "wealth-plans";
  const ACTIVE = "wealth-plan-active";
  const money = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: 0 });
  function inr(n) { return money.format(Math.round(Number(n) || 0)); }
  function uid() { return Math.random().toString(36).slice(2, 10); }
  function localISO(d) {
    const z = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
  }
  function yearsAgo(n) {
    const d = new Date();
    d.setFullYear(d.getFullYear() - n);
    return localISO(d);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function blankPlan() {
    return {
      id: uid(),
      name: "New plan",
      dateOfBirth: yearsAgo(35),
      lifeExpectancyAge: 85,
      retirementAge: 60,
      planStartDate: localISO(new Date()),
      contingencyMonths: 6,
      buildPeriodMonths: 12,
      inflation: 0.065,
      incomes: [],
      assets: [],
      liabilities: [],
      goals: []
    };
  }
  let plans = [];
  let activeId = null;
  let view = "edit";
  let profileMsg = "";
  let editing = null;
  try {
    plans = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (!Array.isArray(plans) || !plans.length) plans = [blankPlan()];
  } catch (e) {
    plans = [blankPlan()];
  }
  activeId = localStorage.getItem(ACTIVE);
  if (!plans.some(function (p) { return p.id === activeId; })) activeId = plans[0].id;

  function active() { return plans.find(function (p) { return p.id === activeId; }) || plans[0]; }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(plans));
    localStorage.setItem(ACTIVE, activeId);
  }
  function ageNow(plan) { return WP.ageOn(plan.dateOfBirth, plan.planStartDate); }

  function addGoal(partial) {
    const plan = active();
    const age = ageNow(plan);
    const row = Object.assign({
      id: uid(),
      name: "Goal",
      category: "Other",
      kind: "once",
      amountToday: 0,
      inflation: plan.inflation,
      targetAge: plan.retirementAge,
      startAge: age,
      endAge: plan.lifeExpectancyAge,
      every: 1,
      unit: "year",
      safetyShield: false,
      loan: null
    }, partial);
    plan.goals.push(row);
    editing = { section: "goals", id: row.id };
    save();
    render();
  }
  function presets() {
    const plan = active();
    const age = ageNow(plan);
    return {
      retirement: function () {
        addGoal({ name: "Retirement spends", category: "Retirement Spends", kind: "recurring", amountToday: 100000, startAge: plan.retirementAge, endAge: plan.lifeExpectancyAge, every: 1, unit: "month", safetyShield: true, targetAge: null });
      },
      home: function () { addGoal({ name: "Dream home", category: "Home", kind: "once", amountToday: 15000000, targetAge: plan.retirementAge }); },
      education: function () { addGoal({ name: "Child's education", category: "Education", kind: "once", amountToday: 5000000, targetAge: Math.min(plan.lifeExpectancyAge, age + 10) }); },
      wedding: function () { addGoal({ name: "Child's wedding", category: "Wedding", kind: "once", amountToday: 2500000, targetAge: Math.min(plan.lifeExpectancyAge, age + 15) }); },
      car: function () { addGoal({ name: "Car upgrade", category: "Car", kind: "recurring", amountToday: 1500000, startAge: age, endAge: plan.lifeExpectancyAge, every: 8, unit: "year", safetyShield: false }); },
      spend: function () { addGoal({ name: "Monthly spend", category: "Other", kind: "recurring", amountToday: 50000, startAge: age, endAge: plan.retirementAge, every: 1, unit: "month" }); },
      vacation: function () { addGoal({ name: "Annual vacation", category: "Vacation", kind: "recurring", amountToday: 300000, startAge: age, endAge: plan.lifeExpectancyAge, every: 1, unit: "year" }); },
      custom: function () { addGoal({ name: "Custom goal" }); }
    };
  }
  function addIncome() {
    const plan = active();
    const row = { id: uid(), name: "Income", kind: "recurring", amountToday: 0, every: 1, unit: "month", startDate: plan.planStartDate, endDate: null, growthStart: 0, growthEnd: 0 };
    plan.incomes.push(row);
    editing = { section: "incomes", id: row.id };
    save();
    render();
  }
  function addLiability(partial) {
    const plan = active();
    const start = new Date(plan.planStartDate + "T00:00:00");
    function plusYears(n) {
      const d = new Date(start.getTime());
      d.setFullYear(d.getFullYear() + n);
      return localISO(d);
    }
    const row = Object.assign({ id: uid(), name: "Loan", principal: 0, endDate: "", annualRate: 0.12 }, partial && partial.endYears ? { name: partial.name, annualRate: partial.annualRate, endDate: plusYears(partial.endYears), principal: 0 } : partial);
    plan.liabilities.push(row);
    editing = { section: "liabilities", id: row.id };
    save();
    render();
  }
  function addAsset(partial) {
    const plan = active();
    const start = new Date(plan.planStartDate + "T00:00:00");
    function plusYears(n) {
      const d = new Date(start.getTime());
      d.setFullYear(d.getFullYear() + n);
      return localISO(d);
    }
    const retire = new Date(plan.dateOfBirth + "T00:00:00");
    retire.setFullYear(retire.getFullYear() + Number(plan.retirementAge));
    let rebalanceDate = plan.planStartDate;
    if (partial && partial.rebalance === "retire") rebalanceDate = localISO(retire);
    if (partial && partial.rebalanceYears) rebalanceDate = plusYears(partial.rebalanceYears);
    const row = {
      id: uid(),
      name: partial.name,
      category: partial.category,
      amount: 0,
      growth: partial.growth,
      rebalanceDate: rebalanceDate
    };
    plan.assets.push(row);
    editing = { section: "assets", id: row.id };

    render();
  }

  function field(label, html) { return "<label>" + esc(label) + html + "</label>"; }
  function num(section, id, bind, value, scale) {

  }
  function dateInput(section, id, bind, value) {

  }
  function textInput(section, id, bind, value) {

  }
  function selectInput(section, id, bind, value, options) {

  function goalEditor(goal) {
    const cats = ["Home", "Education", "Car", "Vacation", "Wedding", "Retirement Spends", "Other"];

      field(once ? "Amount today" : "Amount per occurrence", num("goals", goal.id, "amountToday", goal.amountToday)) +
      field("Inflation %", num("goals", goal.id, "inflation", goal.inflation, "percent")) +

      (!once ? "<label class='check'><input data-section='goals' data-id='" + goal.id + "' data-bind='safetyShield' type='checkbox'" + (goal.safetyShield ? " checked" : "") + "> Safety shield</label>" : "") +
      (once ? "<label class='check'><input data-section='goals' data-id='" + goal.id + "' data-bind='loanOn' type='checkbox'" + (goal.loan ? " checked" : "") + "> Fund part with a loan</label>" : "") +
      (once && goal.loan ? field("Down payment %", num("goals", goal.id, "downPaymentPercent", loan.downPaymentPercent)) + field("Loan interest %", num("goals", goal.id, "loanRate", loan.annualRate, "percent")) + field("Tenor years", num("goals", goal.id, "tenorYears", loan.tenorYears)) : "") +
      "</div>";
  }
  function incomeEditor(row) {
    return "<div class='grid'>" +
      field("Label", textInput("incomes", row.id, "name", row.name)) +
      field("Type", "<select data-section='incomes' data-id='" + row.id + "' data-bind='kind'><option value='recurring'" + (row.kind !== "once" ? " selected" : "") + ">Recurring</option><option value='once'" + (row.kind === "once" ? " selected" : "") + ">One time</option></select>") +
      field("Amount today", num("incomes", row.id, "amountToday", row.amountToday)) +
      (row.kind === "once" ? "" : field("Every", num("incomes", row.id, "every", row.every)) + field("Unit", "<select data-section='incomes' data-id='" + row.id + "' data-bind='unit'><option" + (row.unit !== "year" ? " selected" : "") + ">month</option><option" + (row.unit === "year" ? " selected" : "") + ">year</option></select>") + field("Starting growth %", num("incomes", row.id, "growthStart", row.growthStart, "percent")) + field("Ending growth %", num("incomes", row.id, "growthEnd", row.growthEnd, "percent"))) +

  function liabilityEditor(row, plan) {
    const warn = WP.loanLength(plan, row.endDate) ? "" : "<p class='note'>Set an end date after the plan start. Until then this loan is left out of the projection.</p>";
    return warn + "<div class='grid'>" +
      field("Label", textInput("liabilities", row.id, "name", row.name)) +
      field("Principal left", num("liabilities", row.id, "principal", row.principal)) +

      field("Interest %", num("liabilities", row.id, "annualRate", row.annualRate, "percent")) +
      "</div>";
  }
  function assetEditor(row) {
    const cats = ["Cash/Bank", "Equity/MF", "Real Estate", "Gold", "Fixed Income", "Retirement Corpus (PF/NPS)", "Other"];
    return "<div class='grid'>" +
      field("Label", textInput("assets", row.id, "name", row.name)) +
      field("Category", selectInput("assets", row.id, "category", row.category, cats)) +
      field("Balance today", num("assets", row.id, "amount", row.amount)) +
      field("Growth % per year", num("assets", row.id, "growth", row.growth, "percent")) +
      field("Rebalance date", dateInput("assets", row.id, "rebalanceDate", row.rebalanceDate)) +
      "</div><p class='meta'>The balance cannot be spent until the rebalance year.</p>";
  }

  const goalColors = ["#f2d48a", "#ff8b7b", "#7eb6ff", "#c9a0ff", "#5ad0c8", "#f0a35e", "#e07ad4", "#b5d36a", "#ff9ec8", "#8fd0ff"];
  function goalColor(index) { return goalColors[(Number(index) || 0) % goalColors.length]; }
  function chart(rows, lines, markGoals) {
    const w = 520, h = 200, pad = 28;
    const values = lines.flatMap(function (line) { return rows.map(line.get); });
    let min = Math.min(0, ...values);
    let max = Math.max(1, ...values);
    if (min === max) max = min + 1;
    function x(i) { return pad + (rows.length === 1 ? (w - pad * 2) / 2 : (i * (w - pad * 2)) / (rows.length - 1)); }
    function y(v) { return h - pad - ((v - min) / (max - min)) * (h - pad * 2); }
    const base = y(Math.min(0, min));
    const paths = lines.map(function (line) {
      const pts = rows.map(function (row, i) { return x(i).toFixed(1) + " " + y(line.get(row)).toFixed(1); });
      const linePath = pts.map(function (p, i) { return (i ? "L" : "M") + p; }).join(" ");
      const area = linePath + " L" + x(rows.length - 1).toFixed(1) + " " + base.toFixed(1) + " L" + x(0).toFixed(1) + " " + base.toFixed(1) + " Z";
      return "<path d='" + area + "' fill='" + line.color + "' fill-opacity='0.28'/>" +
        "<path d='" + linePath + "' fill='none' stroke='" + line.color + "' stroke-width='2'/>";
    }).join("");
    const labels = rows.length ? "<text x='" + pad + "' y='" + (h - 8) + "' font-size='11' fill='#9aa6b4'>" + rows[0].year + "</text><text x='" + (w - pad) + "' y='" + (h - 8) + "' font-size='11' fill='#9aa6b4' text-anchor='end'>" + rows[rows.length - 1].year + "</text>" : "";
    const marks = markGoals ? rows.map(function (row, i) {
      const once = (row.milestones || []).filter(function (m) { return m.once; });
      if (!once.length) return "";
      const cx = x(i);
      const cy = y(lines[0].get(row));
      const lineColor = goalColor(once[0].index);
      const dots = once.map(function (m, k) {
        const color = goalColor(m.index);
        const cyk = cy - k * 11;
        const label = "<text x='" + (cx + 8).toFixed(1) + "' y='" + Math.max(12, cyk - 6).toFixed(1) + "' font-size='10' fill='" + color + "'>" + esc(String(m.name || "Goal").slice(0, 18)) + "</text>";
        return "<circle cx='" + cx.toFixed(1) + "' cy='" + cyk.toFixed(1) + "' r='4.5' fill='" + color + "' stroke='#10141a' stroke-width='1'/>" + label;
      }).join("");
      return "<line x1='" + cx.toFixed(1) + "' x2='" + cx.toFixed(1) + "' y1='" + cy.toFixed(1) + "' y2='" + (h - pad) + "' stroke='" + lineColor + "' stroke-opacity='0.45' stroke-dasharray='3 3'/>" + dots;
    }).join("") : "";
    const seenGoal = {};
    const onceLegend = [];
    const recurLegend = [];
    if (markGoals) {
      rows.forEach(function (row) {
        (row.milestones || []).forEach(function (m) {
          if (seenGoal[m.index]) return;
          seenGoal[m.index] = true;
          const item = "<span style='color:" + goalColor(m.index) + "'>" + esc(m.name || "Goal") + "</span>";
          (m.once ? onceLegend : recurLegend).push(item);
        });
      });
    }
    const legend = lines.map(function (line) { return "<span style='color:" + line.color + "'>" + esc(line.name) + "</span>"; }).join(" · ") +
      (onceLegend.length ? "<br>One-time · " + onceLegend.join(" · ") : "") +
      (recurLegend.length ? "<br>Recurring · " + recurLegend.join(" · ") : "");
    const series = lines.map(function (line) {
      return line.name.replace(/\|/g, "") + "|" + line.color + "|" + rows.map(function (row) { return Math.round(line.get(row)); }).join(",");
    }).join(";");
    const markData = [];
    rows.forEach(function (row, i) {
      (row.milestones || []).forEach(function (m) {
        markData.push(i + "~" + String(m.name || "Goal").replace(/[~;]/g, " ") + "~" + Math.round(m.amount) + "~" + goalColor(m.index) + "~" + (m.once ? "1" : "0"));
      });
    });
    return "<div class='chart' data-years='" + rows.map(function (row) { return row.year; }).join(",") + "' data-ages='" + rows.map(function (row) { return row.age; }).join(",") + "' data-series='" + series + "' data-marks='" + markData.join(";") + "'><svg viewBox='0 0 " + w + " " + h + "' role='img'>" + paths + marks + "<line class='cursor' x1='0' x2='0' y1='" + pad + "' y2='" + (h - pad) + "' stroke='#e8eef5' stroke-opacity='0.35' visibility='hidden'/>" + labels + "</svg><div class='tip' hidden></div><p class='meta'>" + legend + "</p></div>";
  }

  function reportHTML(plan) {
    const err = WP.profileError(plan);
    if (err) return "<p class='note'>" + esc(err) + "</p>";
    const result = WP.project(plan);
    const early = WP.earliestRetirementAge(plan);
    const status = result.funded
      ? "Funded through age " + plan.lifeExpectancyAge + "."
      : "Shortfall starts at age " + result.firstShortfallAge + ". Unfunded total " + inr(result.unfunded) + ".";
    const earlyText = early == null ? "No retirement age in range funds this plan." : "Earliest retirement age that still funds the plan: " + early + ".";
    const cards = [
      ["Retirement age", plan.retirementAge],
      ["Final net worth", inr(result.finalNetWorth)],
      ["Peak net worth", inr(result.peakNetWorth) + " at " + result.peakAge],
      ["Interest paid", inr(result.interestPaid)],
      ["Total invested", inr(result.totalInvested)],
      ["Contingency at end", inr(result.contingencyEnd)]
    ].map(function (pair) { return "<div class='stat'><span class='meta'>" + pair[0] + "</span><b>" + pair[1] + "</b></div>"; }).join("");
    const onceRows = [];
    const recurRows = [];
    plan.goals.forEach(function (goal, index) {
      const firstYear = goal.kind === "once"
        ? yearOfSafe(plan.dateOfBirth) + Number(goal.targetAge)
        : yearOfSafe(plan.dateOfBirth) + Number(goal.startAge);
      const years = Math.max(0, firstYear - yearOfSafe(plan.planStartDate));
      const inflatedCost = (function () {
        const rate = Number(goal.inflation == null ? plan.inflation : goal.inflation) || 0;
        let cost = Number(goal.amountToday) || 0;
        for (let i = 0; i < years; i++) cost *= 1 + rate;
        return cost;
      })();
      const down = goal.loan ? inflatedCost * (Number(goal.loan.downPaymentPercent) || 0) / 100 : null;
      const name = "<td><span class='swatch' style='background:" + goalColor(index) + "'></span>" + esc(goal.name) + "</td>";
      const cells = name + "<td>" + inr(goal.amountToday) + "</td><td>" + inr(inflatedCost) + "</td><td>" + (down == null ? "—" : inr(down)) + "</td><td>" + (result.funded ? "Funded" : "Shortfall") + "</td>";
      if (goal.kind === "once") onceRows.push("<tr>" + cells + "</tr>");
      else recurRows.push("<tr>" + cells + "<td>every " + esc(goal.every) + " " + esc(goal.unit) + "</td></tr>");
    });
    const yearRows = result.rows.map(function (row) {
      return "<tr><td>" + row.age + "</td><td>" + row.year + "</td><td>" + inr(row.income) + "</td><td>" + inr(row.goalSpending) + "</td><td>" + inr(row.liabilityPayment) + "</td><td>" + inr(row.interest) + "</td><td>" + inr(row.contingency) + "</td><td>" + inr(row.shortfall) + "</td><td>" + inr(row.netWorth) + "</td></tr>";
    }).join("");
    const inputs = "<p><b>Born</b> " + esc(plan.dateOfBirth) + " · <b>Retire</b> " + plan.retirementAge + " · <b>Life expectancy</b> " + plan.lifeExpectancyAge + " · <b>Start</b> " + esc(plan.planStartDate) + " · <b>Inflation</b> " + (plan.inflation * 100).toFixed(2) + "% · <b>Contingency</b> " + plan.contingencyMonths + " months · <b>Build</b> " + plan.buildPeriodMonths + " months</p>" +
      listLine("Incomes", plan.incomes, function (row) { return esc(row.name) + " " + inr(row.amountToday); }) +
      listLine("Assets", plan.assets, function (row) { return esc(row.name) + " " + inr(row.amount); }) +
      listLine("Liabilities", plan.liabilities, function (row) { return esc(row.name) + " " + inr(row.principal); }) +
      listLine("One-time goals", plan.goals.filter(function (row) { return row.kind === "once"; }), function (row) { return esc(row.name) + " " + inr(row.amountToday); }) +
      listLine("Recurring goals", plan.goals.filter(function (row) { return row.kind !== "once"; }), function (row) { return esc(row.name) + " " + inr(row.amountToday) + " every " + row.every + " " + row.unit; });
    return "<section class='card'><p class='" + (result.funded ? "ok" : "note") + "'>" + status + " " + earlyText + "</p><div class='cards'>" + cards + "</div>" +
      "<div class='chart-grid'>" +
      chart(result.rows, [{ name: "Net worth", color: "#3dbe86", get: function (r) { return r.netWorth; } }], true) +
      chart(result.rows, [{ name: "Assets", color: "#7eb6ff", get: function (r) { return r.assets; } }, { name: "Liabilities", color: "#e0a06a", get: function (r) { return r.liabilities; } }], true) +
      "</div>" +
      chart(result.rows, [{ name: "Contingency", color: "#3dbe86", get: function (r) { return r.contingency; } }]) +
      "<h2>One-time goals</h2><table><thead><tr><th>Name</th><th>Today</th><th>Inflated at due year</th><th>Down payment</th><th>Plan</th></tr></thead><tbody>" + (onceRows.join("") || "<tr><td colspan='5'>No one-time goals</td></tr>") + "</tbody></table>" +
      "<h2>Recurring goals</h2><table><thead><tr><th>Name</th><th>Today</th><th>Inflated at first due year</th><th>Down payment</th><th>Plan</th><th>Repeats</th></tr></thead><tbody>" + (recurRows.join("") || "<tr><td colspan='6'>No recurring goals</td></tr>") + "</tbody></table>" +
      "<h2>Year by year</h2><details><summary>Show " + result.rows.length + " years</summary><table><thead><tr><th>Age</th><th>Year</th><th>Income</th><th>Goals</th><th>Loan payment</th><th>Interest</th><th>Contingency</th><th>Shortfall</th><th>Net worth</th></tr></thead><tbody>" + yearRows + "</tbody></table></details>" +
      "<h2>Inputs</h2>" + inputs + "</section>";
  }
  function yearOfSafe(iso) { return Number(String(iso).slice(0, 4)); }
  function listLine(title, rows, fmt) {
    return "<p><b>" + title + ".</b> " + (rows.length ? rows.map(fmt).join("; ") : "None") + "</p>";
  }

  const pencil = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M12 20h9'/><path d='M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z'/></svg>";
  const trash = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'><path d='M3 6h18'/><path d='M8 6V4h8v2'/><path d='M19 6l-1 14H6L5 6'/></svg>";
  function iconBtn(action, section, id, svg, label) {

  function rowSummary(section, row, plan) {

    if (section === "liabilities") return inr(row.principal) + " · " + ((Number(row.annualRate) || 0) * 100).toFixed(2) + "% · " + (row.endDate || "no end date");
    return inr(row.amount) + " · " + ((Number(row.growth) || 0) * 100).toFixed(2) + "% · " + esc(row.category);
  }
  function listBlock(section, rows, editor, plan) {

      edit +

  }
  function button(action, preset, label) {

  }

  function readValue(el) {
    if (el.type === "checkbox") return el.checked;
    if (el.dataset.scale === "percent") return (Number(el.value) || 0) / 100;
    if (el.type === "number") return Number(el.value);
    if (el.type === "date") return el.value || null;
    return el.value;
  }
  function applyInput(el) {
    const plan = active();
    const bind = el.dataset.bind;
    const value = readValue(el);
    if (el.dataset.section === "profile") {
      const next = Object.assign({}, plan, { [bind]: value });
      const err = WP.profileError(next);
      profileMsg = err;
      const note = document.querySelector(".card .note");
      if (err) {
        if (note) note.textContent = err;
        else render();
        return;
      }
      if (bind === "inflation") {
        plan.goals.forEach(function (goal) {
          if (goal.inflation == null || Math.abs(Number(goal.inflation) - Number(plan.inflation)) < 1e-8) goal.inflation = value;
        });
      }
      plan[bind] = value;
      profileMsg = "";
      save();
      refreshReport();
      return;
    }
    const list = plan[el.dataset.section];
    const row = list.find(function (item) { return item.id === el.dataset.id; });
    if (!row) return;
    if (bind === "loanOn") {
      row.loan = value ? { downPaymentPercent: 20, annualRate: 0.085, tenorYears: 15 } : null;
      save();
      render();
      return;
    }
    if (bind === "downPaymentPercent" || bind === "loanRate" || bind === "tenorYears") {
      row.loan = row.loan || { downPaymentPercent: 20, annualRate: 0.085, tenorYears: 15 };
      if (bind === "downPaymentPercent") row.loan.downPaymentPercent = Math.min(100, Math.max(0, Number(value) || 0));
      if (bind === "loanRate") row.loan.annualRate = Number(value) || 0;
      if (bind === "tenorYears") row.loan.tenorYears = Number(value) || 0;
    } else if (bind === "kind" || bind === "unit" || bind === "safetyShield") {
      row[bind] = bind === "kind" ? el.value : value;
      if (bind === "kind" || bind === "unit") {
        save();
        render();
        return;
      }
    } else {
      row[bind] = value;
    }
    save();
    refreshReport();
  }
  function refreshReport() {
    const holder = document.getElementById("live-report");
    if (holder) holder.innerHTML = reportHTML(active());
    if (view === "report") render();
  }

  document.getElementById("app").addEventListener("mousemove", function (event) {
    const box = event.target.closest ? event.target.closest(".chart") : null;
    document.querySelectorAll(".chart .tip").forEach(function (tip) {
      if (!box || tip.parentElement !== box) tip.hidden = true;
    });
    document.querySelectorAll(".chart .cursor").forEach(function (line) {
      if (!box || line.closest(".chart") !== box) line.setAttribute("visibility", "hidden");
    });
    if (!box) return;
    const years = (box.dataset.years || "").split(",").filter(Boolean);
    if (!years.length) return;
    const svg = box.querySelector("svg");
    const rect = svg.getBoundingClientRect();
    const pad = 28;
    const x = ((event.clientX - rect.left) / rect.width) * 520;
    const inner = 520 - pad * 2;
    let index = years.length === 1 ? 0 : Math.round(((x - pad) / inner) * (years.length - 1));
    index = Math.max(0, Math.min(years.length - 1, index));
    const ages = (box.dataset.ages || "").split(",");
    const series = (box.dataset.series || "").split(";").filter(Boolean).map(function (part) {
      const bits = part.split("|");
      return { name: bits[0], color: bits[1], values: (bits[2] || "").split(",") };
    });
    const tip = box.querySelector(".tip");
    tip.hidden = false;
    const goalsDue = (box.dataset.marks || "").split(";").filter(Boolean).filter(function (part) {
      return part.split("~")[0] === String(index);
    }).map(function (part) {
      const bits = part.split("~");
      const kind = bits[4] === "0" ? " · recurring" : "";
      return "<span style='color:" + (bits[3] || "#f2d48a") + "'>" + esc(bits[1]) + " " + inr(bits[2] || 0) + kind + "</span>";
    });
    tip.innerHTML = "<b>" + years[index] + "</b> · age " + (ages[index] || "") + "<br>" + series.map(function (line) {
      return "<span style='color:" + line.color + "'>" + esc(line.name) + " " + inr(line.values[index] || 0) + "</span>";
    }).join("<br>") + (goalsDue.length ? "<br>" + goalsDue.join("<br>") : "");
    const left = event.clientX - rect.left + 12;
    tip.style.left = Math.min(left, rect.width - 160) + "px";
    tip.style.top = "8px";
    const cursor = box.querySelector(".cursor");
    const cx = pad + (years.length === 1 ? inner / 2 : (index * inner) / (years.length - 1));
    cursor.setAttribute("x1", cx);
    cursor.setAttribute("x2", cx);
    cursor.setAttribute("visibility", "visible");
  });
  document.getElementById("app").addEventListener("input", function (event) {
    if (event.target.dataset && event.target.dataset.bind) applyInput(event.target);
  });
  document.getElementById("app").addEventListener("change", function (event) {
    if (event.target.id === "plan-pick") {
      activeId = event.target.value;
      profileMsg = "";
      save();
      render();
      return;
    }
    if (event.target.id === "import-file") {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const data = JSON.parse(String(reader.result));
          if (!data || typeof data.name !== "string" || !Array.isArray(data.incomes) || !Array.isArray(data.assets) || !Array.isArray(data.liabilities) || !Array.isArray(data.goals)) throw new Error("bad");
          data.id = uid();
          ["incomes", "assets", "liabilities", "goals"].forEach(function (key) {
            data[key].forEach(function (row) { row.id = uid(); });
          });
          plans.push(data);
          activeId = data.id;
          save();
          render();
        } catch (e) {
          alert("That file is not a plan.");
        }
      };
      reader.readAsText(file);
      return;
    }
    if (event.target.dataset && event.target.dataset.bind) applyInput(event.target);
  });
  document.getElementById("app").addEventListener("click", function (event) {
    const btn = event.target.closest("button");
    if (!btn) return;
    const plan = active();
    const action = btn.dataset.action;
    if (action === "view") { view = btn.dataset.view; render(); }
    if (action === "new") {
      const name = prompt("Plan name", "New plan");
      if (!name) return;
      const created = blankPlan();
      created.name = name.trim();
      plans.push(created);
      activeId = created.id;
      save();
      render();
    }
    if (action === "rename") {
      const name = prompt("Plan name", plan.name);
      if (!name) return;
      plan.name = name.trim();
      save();
      render();
    }
    if (action === "duplicate") {
      const copy = JSON.parse(JSON.stringify(plan));
      copy.id = uid();
      copy.name = "Copy of " + plan.name;
      ["incomes", "assets", "liabilities", "goals"].forEach(function (key) {
        copy[key].forEach(function (row) { row.id = uid(); });
      });
      plans.push(copy);
      activeId = copy.id;
      save();
      render();
    }
    if (action === "delete") {
      if (plans.length === 1) {
        plans[0] = blankPlan();
        activeId = plans[0].id;
      } else if (confirm("Delete " + plan.name + "?")) {
        plans = plans.filter(function (p) { return p.id !== plan.id; });
        activeId = plans[0].id;
      } else return;
      save();
      render();
    }
    if (action === "preset") presets()[btn.dataset.preset]();
    if (action === "add-income") addIncome();
    if (action === "add-loan") {
      const kind = btn.dataset.preset;
      if (kind === "home") addLiability({ name: "Home loan", annualRate: 0.08, endYears: 30 });
      if (kind === "car") addLiability({ name: "Car loan", annualRate: 0.095, endYears: 5 });
      if (kind === "custom") addLiability({ name: "Custom loan", annualRate: 0.12, endDate: "" });
    }
    if (action === "add-asset") {
      const kind = btn.dataset.preset;
      if (kind === "liquid") addAsset({ name: "Current liquid net worth", category: "Equity/MF", growth: 0.09, rebalance: "start" });
      if (kind === "property") addAsset({ name: "Real estate to sell", category: "Real Estate", growth: 0.05, rebalanceYears: 10 });
      if (kind === "nps") addAsset({ name: "NPS/PF lumpsum", category: "Retirement Corpus (PF/NPS)", growth: 0.08, rebalance: "retire" });
      if (kind === "fd") addAsset({ name: "FD maturity", category: "Fixed Income", growth: 0.06, rebalanceYears: 1 });
      if (kind === "custom") addAsset({ name: "Custom asset", category: "Other", growth: 0.08, rebalance: "start" });
    }
    if (action === "edit") {
      editing = { section: btn.dataset.section, id: btn.dataset.id };
      render();
    }
    if (action === "save") {
      editing = null;
      save();
      render();
    }
    if (action === "remove") {
      plan[btn.dataset.section] = plan[btn.dataset.section].filter(function (row) { return row.id !== btn.dataset.id; });
      if (editing && editing.id === btn.dataset.id) editing = null;
      save();
      render();
    }
    if (action === "print") {
      view = "report";
      render();
      setTimeout(function () { window.print(); }, 50);
    }
    if (action === "export") {
      const blob = new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (plan.name || "plan").replace(/[^\w\- ]+/g, "") + ".json";
      a.click();
      URL.revokeObjectURL(a.href);
    }
  });
  render();
})();
</script>
</body>
</html>
